name: Check shared article workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: bash scripts/setup.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: git diff --check
